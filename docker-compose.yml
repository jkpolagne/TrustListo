name: trustlisto

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trustlisto
      POSTGRES_PASSWORD: trustlisto
      POSTGRES_DB: trustlisto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/20-trim-extensions.sql:/docker-entrypoint-initdb.d/20-trim-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustlisto"]
      interval: 5s
      retries: 10

  # MinIO = local stand-in for DigitalOcean Spaces (same S3 code path).
  # Official minio/minio images were removed from Docker Hub; pgsty/minio is a maintained community build.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
